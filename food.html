function toTop(){ if (window.matchMedia('(max-width:800px)').matches) window.scrollTo(0, 0); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1200); }
function copy(t, label){ navigator.clipboard.writeText(t).then(() => toast(label + 'をコピー')).catch(() => { window.prompt('コピーしてください', t); }); }
function renderList(){
  const done = ROWS.filter(r => (state[r['優先']]||{}).r === '送信完了').length;
  $('#cnt').textContent = done + ' / ' + ROWS.length + ' 送信済';
  $('#list').innerHTML = ROWS.map((r, i) => { const s = state[r['優先']] || {}; const cls = s.r === '送信完了' ? 'done' : (s.r === 'スキップ' ? 'skip' : '');
    return '<div class="it ' + cls + (i === cur ? ' cur' : '') + '" data-i="' + i + '"><span class="n">' + esc(r['優先']) + '</span><span>' + esc(r['店名']) + '</span><span class="s">' + esc(s.r || r['送付手段'].replace('（要目視）','')) + '</span></div>'; }).join('');
  document.querySelectorAll('#list .it').forEach(el => el.onclick = () => { cur = +el.dataset.i; render(); });
  $('#pick').innerHTML = ROWS.map((r, i) => { const s = state[r['優先']] || {}; const mk = s.r === '送信完了' ? '✓ ' : (s.r === 'スキップ' ? '－ ' : ''); return '<option value="' + i + '"' + (i === cur ? ' selected' : '') + '>' + esc(mk + r['優先'] + '. ' + r['店名']) + '</option>'; }).join('');
}
function field(k, v){ return v ? '<div class="f"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div><button data-c="' + esc(v) + '" data-l="' + esc(k) + '">コピー</button></div>' : ''; }
function render(){
  const r = ROWS[cur]; const s = state[r['優先']] || {};
  const how = r['送付手段'] || '';
  let hint = '';
  if (how.startsWith('フォーム')) hint = '送り先を開き、各欄をコピーして貼る。送信ボタンを押したら「送信完了」。' + (r['CAPTCHA'] ? ' <span class="warn">CAPTCHA あり</span>' : '');
  else if (how.startsWith('メール')) hint = '「メールで開く」でメールソフトに件名・本文入りの下書きが開く。';
  else hint = '問い合わせページを開き、フォーム・メール・LINE のどれかを探して本文を貼る。';
  const mailto = how.startsWith('メール') ? 'mailto:' + encodeURIComponent(r['送り先']).replace(/%40/g,'@') + '?subject=' + encodeURIComponent(r['件名']) + '&body=' + encodeURIComponent(r['本文']) : '';
  $('#view').innerHTML = '<h2 style="margin:0 0 4px">' + esc(r['店名']) + (r['確度'] ? ' <small style="font-weight:normal;color:var(--mut)">確度' + esc(r['確度']) + '</small>' : '') + '</h2>'
    + (r['店のタイプ'] || r['店の特徴'] ? '<div style="margin-bottom:6px">' + esc([r['店のタイプ'], r['店の特徴']].filter(Boolean).join('｜')) + '</div>' : '')
    + (r['確度の理由'] ? '<div style="color:var(--mut);margin-bottom:6px">確度の理由: ' + esc(r['確度の理由']) + '</div>' : '')
    + (r['確度'] && r['メモ'] ? '<div style="color:var(--mut);margin-bottom:6px">メモ: ' + esc(r['メモ']) + '</div>' : '')
    + '<div class="meta"><span>市区町村</span><b>' + esc(r['市区町村']) + '</b><span>ジャンル</span><b>' + esc(r['ジャンル']) + '</b><span>規模</span><b>' + esc([(r['席数・規模'] || r['席数']), r['店舗数（推定）'] ? r['店舗数（推定）'] + '店舗（' + r['店舗数の根拠'] + '）' : ''].filter(Boolean).join(' / ')) + '</b>'
    + '<span>法人名</span><b>' + esc(r['法人名（サイト記載）']) + '</b><span>代表者</span><b>' + esc(r['代表者（サイト記載）'] || '—') + '</b><span>電話</span><b>' + esc(r['電話']) + '</b>'
    + '<span>営業お断り</span><b>' + esc(r['営業お断り'] || '—') + '</b></div>'
    + '<div class="dest"><b>' + esc(how) + '</b><code title="' + esc(r['送り先']) + '">' + esc(r['送り先']) + '</code>'
    + (mailto ? '<a href="' + esc(mailto) + '"><button class="p">メールで開く</button></a>' : '<button class="p" id="open">送り先を開く</button>')
    + '<a href="' + esc(r['サイト']) + '" target="_blank" rel="noopener"><button>サイト</button></a><a href="' + esc(r['掲載元URL'] || r['食べログ']) + '" target="_blank" rel="noopener"><button>掲載元</button></a></div>'
    + '<div style="color:var(--mut);margin-bottom:10px">' + hint + '</div>'
    + '<div class="fields">' + field('会社名', SENDER['会社名']) + field('氏名', SENDER['氏名']) + field('氏（姓の欄）', SENDER['氏']) + field('名（名の欄）', SENDER['名']) + field('フリガナ（カタカナ）', SENDER['フリガナ']) + field('セイ（カタカナ）', SENDER['氏（カナ）']) + field('メイ（カタカナ）', SENDER['名（カナ）']) + field('ふりがな（ひらがな）', SENDER['ふりがな']) + field('せい（ひらがな）', SENDER['氏（ひらがな）']) + field('めい（ひらがな）', SENDER['名（ひらがな）']) + field('メール', SENDER['メール']) + field('電話', SENDER['電話']) + field('電話（ハイフンなし）', SENDER['電話（ハイフンなし）']) + field('郵便番号', SENDER['郵便番号']) + field('郵便番号（ハイフンなし）', SENDER['郵便番号（ハイフンなし）']) + field('住所', SENDER['所在地']) + field('件名', r['件名']) + '</div>'
    + (r['ひとこと'] ? '<div style="color:var(--mut);margin-bottom:8px">ひとこと（' + esc(r['ひとことの根拠']) + '）: ' + esc(r['ひとこと']) + '</div>' : '')
    + '<div class="box"><div class="k"><b>本文</b><button data-c="' + esc(r['本文']) + '" data-l="本文">コピー</button></div><pre>' + esc(r['本文']) + '</pre></div>'
    + '<div class="acts"><button class="ok" data-r="送信完了">送信完了</button><button class="ng" data-r="スキップ">スキップ</button><input id="memo" placeholder="メモ（任意）" value="' + esc(s.m || '') + '"></div>'
    + (s.r ? '<div style="color:var(--mut)">記録: ' + esc(s.r) + (s.d ? '（' + esc(s.d) + '）' : '') + '</div>' : '');
  document.querySelectorAll('#view button[data-c]').forEach(b => b.onclick = () => copy(b.dataset.c, b.dataset.l));
  const op = $('#open'); if (op) op.onclick = () => window.open(r['送り先'], '_blank', 'noopener');
  document.querySelectorAll('#view button[data-r]').forEach(b => b.onclick = () => { state[r['優先']] = {r: b.dataset.r, d: today(), m: $('#memo').value}; save(); if (cur < ROWS.length - 1) cur++; render(); toTop(); });
  renderList();
  const curEl = document.querySelector('#list .it.cur'); if (curEl) curEl.scrollIntoView({block: 'nearest'});
}
$('#exp').onclick = () => {
  const lines = [['優先','店名','結果','送信日','メモ']].concat(ROWS.filter(r => state[r['優先']]).map(r => { const s = state[r['優先']]; return [r['優先'], r['店名'], s.r, s.d, s.m || '']; }));
  const csv = '﻿' + lines.map(l => l.map(v => '"' + String(v ?? '').replace(/"/g,'""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'})); a.download = '送付結果_' + today() + '.csv'; a.click();
};
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'j') { cur = Math.min(cur + 1, ROWS.length - 1); render(); } if (e.key === 'k') { cur = Math.max(cur - 1, 0); render(); } });
$('#pick').onchange = e => { cur = +e.target.value; render(); toTop(); };
$('#prev').onclick = () => { cur = Math.max(cur - 1, 0); render(); toTop(); };
$('#next').onclick = () => { cur = Math.min(cur + 1, ROWS.length - 1); render(); toTop(); };
const firstOpen = ROWS.findIndex(r => !state[r['優先']]); cur = firstOpen >= 0 ? firstOpen : 0;
render();
</script></body></html>
