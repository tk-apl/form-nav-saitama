<html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#fff;--fg:#222;--mut:#666;--line:#ddd;--acc:#1f4e79;--ok:#2e7d32;--ng:#8a1c1c;--box:#f5f6f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Yu Gothic UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:15px;margin:0}header .cnt{color:var(--mut)}header .sp{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.ng{background:var(--ng);color:#fff;border-color:var(--ng)}
main{display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto 1fr;min-height:calc(100vh - 50px)}
#flt{grid-column:1;grid-row:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
#flt input{flex:1 1 100%;min-width:0;font:inherit;font-size:16px;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
#flt select{flex:1 1 0;min-width:0;font:inherit;font-size:16px;padding:5px 4px;border:1px solid var(--line);border-radius:6px;background:#fff}
#fcnt{font-size:12px;color:var(--mut);white-space:nowrap}
aside{grid-column:1;grid-row:2;border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 150px)}
aside .it{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:baseline}
aside .it.cur{background:#eef3f8}aside .it .n{color:var(--mut);width:26px;text-align:right}aside .it .s{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap}
aside .it.done .s{color:var(--ok)}aside .it.skip .s{color:var(--ng)}
aside .it.done{background:#e8f4ec}
aside .it.skip{background:#efefef;color:var(--mut)}
aside .it.cur{background:#dce8f5;box-shadow:inset 3px 0 0 var(--acc)}aside .none{padding:12px;color:var(--mut)}
section{padding:16px 20px;max-width:900px}#view{grid-column:2;grid-row:1 / span 2;min-width:0}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0 12px;color:var(--mut)}.meta b{color:var(--fg);font-weight:600}
.dest{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}.dest code{background:var(--box);padding:4px 8px;border-radius:4px;max-width:560px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:12px}
.f{border:1px solid var(--line);border-radius:6px;padding:8px 10px}.f .k{font-size:12px;color:var(--mut)}.f .v{margin:2px 0 6px;word-break:break-all}
.tri{display:flex;gap:4px}.tri button{flex:1 1 0;min-width:0;padding:6px 4px}
.box{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:10px}.box .k{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}.box .k .edm{font-size:12px;color:var(--mut)}
.box pre,details pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:var(--box);padding:10px;border-radius:4px;max-height:360px;overflow:auto}
#eta{display:block;width:100%;min-height:360px;font:inherit;font-size:16px;line-height:1.6;padding:10px;border:1px solid var(--acc);border-radius:4px;resize:vertical}
mark{background:#fff0a8;color:inherit}
details{margin-top:6px}details summary{cursor:pointer;color:var(--mut)}details pre{margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.acts input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;flex:1;min-width:200px}
.rec{color:var(--mut)}

.rec button{margin-left:8px;padding:2px 10px}
.warn{color:#b35c00}
#mbar{display:none}

.tabs{display:flex;gap:4px}.tab{white-space:nowrap;border:none;background:none;border-bottom:2px solid transparent;border-radius:0;padding:6px 8px;color:var(--mut)}.tab.on{color:var(--fg);border-bottom-color:var(--acc);font-weight:600}
