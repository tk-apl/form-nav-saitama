<style>
:root{--bg:#fff;--fg:#222;--mut:#666;--line:#ddd;--acc:#1f4e79;--ok:#2e7d32;--ng:#8a1c1c;--box:#f5f6f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Yu Gothic UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}

main{display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto 1fr;min-height:calc(100vh - 50px)}
#flt{grid-column:1;grid-row:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
#flt input{flex:1 1 100%;min-width:0;font:inherit;font-size:16px;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
#flt select{flex:1 1 0;min-width:0;font:inherit;font-size:16px;padding:5px 4px;border:1px solid var(--line);border-radius:6px;background:#fff}
#fcnt{font-size:12px;color:var(--mut);white-space:nowrap}
aside{grid-column:1;grid-row:2;border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 150px)}
aside .it{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:baseline}
aside .it.cur{background:#eef3f8}aside .it .n{color:var(--mut);width:26px;text-align:right}aside .it .s{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap}
aside .it.done .s{color:var(--ok)}aside .it.skip .s{color:var(--ng)}aside .none{padding:12px;color:var(--mut)}
section{padding:16px 20px;max-width:900px}#view{grid-column:2;grid-row:1 / span 2;min-width:0}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0 12px;color:var(--mut)}.meta b{color:var(--fg);font-weight:600}

.box pre,details pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:var(--box);padding:10px;border-radius:4px;max-height:360px;overflow:auto}

#mbar{display:none}

  const s = load(); const done = Array.isArray(s['#mig']) ? s['#mig'] : []; let n = 0, touched = false;
  LEGACY.forEach(L => {

    for (const p in old) { const u = L.map[p]; const v = norm(Object.assign({}, old[p] || {})); if (!u) continue;
      const cur = s[u] || {}; let add = false; for (const f in v) if (cur[f] === undefined && v[f] !== undefined && v[f] !== '') { cur[f] = v[f]; add = true; }

function noUrl(t){
  const out = [];
  for (const line of String(t || '').replace(/\r\n?/g, '\n').split('\n')) {
    if (/^\s*(https?:\/\/|www\.)\S*\s*$/i.test(line)) { if (out.length && /^\s*▼/.test(out[out.length - 1])) out.pop(); continue; }
    out.push(line);
  }
  let s = out.join('\n');
  const found = s.includes(SENT_NEW) || s.includes(SENT_OLD) || s.includes(SENT_OLD2);
  s = s.split(SENT_NEW).join(SENT_NEW2).split(SENT_OLD).join(SENT_OLD2);
  s = s.replace(/\n[ \t　]*(?:\n[ \t　]*)+\n/g, '\n\n').replace(/^(?:[ \t　]*\n)+/, '').replace(/(?:\n[ \t　]*)+$/, '');
  return {text: s, warn: !found || /https?:|www\./i.test(s)};
}

}

    + '<div class="acts"><button class="ok" data-r="送信完了">送信完了</button><button class="ng" data-r="スキップ">スキップ</button><input id="memo" placeholder="メモ（任意）" data-id="' + esc(id) + '" value="' + esc(keepMemo != null ? keepMemo : (s.m || '')) + '"></div>'
    + (s.r ? '<div class="rec">記録: ' + esc(s.r) + (s.d ? '（' + esc(s.d) + '）' : '') + (s.r === '送信完了' && s.sv ? '・' + esc(s.sv) : '') + '<button id="urb">取り消す</button></div>' + (s.sb ? '<details><summary>送った文</summary><pre>' + esc(s.sb) + '</pre></details>' : '') : '');
  edInfo(r);

    else { o.sv = undefined; o.sb = undefined; o.bh = undefined; }
    const prev = st(r), back = {}; ['r', 'd', 'sb', 'sv', 'bh'].forEach(f => back[f] = prev[f]);   // 押す前の記録（ふつうは「まだ」）
    const at = cur;

  });

  const curEl = document.querySelector('#list .it.cur'); if (curEl) curEl.scrollIntoView({block: 'nearest'});
}
function goTo(i){ flushEdit(); editing = null; cur = i; render(); toTop(); }
function undoRevert(id){   // 「元に戻す」の前の編集後の本文に戻す

function go(dir, quiet){
  flushEdit();
  const V = vis(); const j = dir > 0 ? V.find(i => i > cur) : V.slice().reverse().find(i => i < cur);
  if (j === undefined) { if (!quiet) toast(dir > 0 ? 'この絞り込みは最後です' : 'この絞り込みは最初です'); return false; }
  goTo(j); return true;
}

// 10/21 あぽろん: 「進捗を確認」で保存した CSV を読み込んで、別の端末・ブラウザに記録を移す
function parseCSV(t){
  const rows = []; let row = [], f = '', q = false;
  t = t.replace(/^﻿/, '');
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x !== ''));
}
function importCSV(text, sjis){
  flushEdit();
  const rows = parseCSV(text); const h = (rows.shift() || []).map(x => x.trim());
  const ix = k => h.indexOf(k), g = (c, k) => ix(k) >= 0 ? String(c[ix(k)] ?? '') : '', gt = (c, k) => g(c, k).replace(/\r\n?/g, '\n');
  if (ix('結果') < 0 || (ix('優先') < 0 && ix('掲載元URL') < 0)) { alert('「進捗を確認」で保存したCSVではないようです。'); return; }
  state = load();
  const byId = {}, byName = {}; ROWS.forEach(r => { byId[ID(r)] = r; (byName[r['店名']] = byName[r['店名']] || []).push(r); });
  const add = [], miss = [];
  rows.forEach(c => {
    const u = g(c, '掲載元URL').trim(), k = g(c, '優先').trim(), nm = g(c, '店名');
    let r = null;
    if (u) r = byId[u] || null;
    else { r = ROWS.find(x => String(x['優先']) === k && (ix('店名') < 0 || x['店名'] === nm)) || null; if (!r && nm && (byName[nm] || []).length === 1) r = byName[nm][0]; }
    if (!r) { miss.push(nm || k || u); return; }
    const id = ID(r), cs = state[id] || {}, o = {}; let over = false;
    let res = g(c, '結果').trim(); if (res === '送信した') res = '送信完了'; if (res === '後で') res = 'スキップ';
    const d = g(c, '送信日').trim().replace(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/, (m, y, mo, da) => y + '-' + pad(mo) + '-' + pad(da));
    if ((res === '送信完了' || res === 'スキップ') && !(cs.r && ((cs.d || '') > d || ((cs.d || '') === d && (cs.r === res || !d))))) {   // 手元の方が新しい・同じ日（同じ記録）なら手元を残す
      o.r = res; o.d = d; if (ix('メモ') >= 0) o.m = g(c, 'メモ') || undefined; over = !!cs.r;
      if (!sjis && res === '送信完了') { if (ix('送った文の種類') >= 0) o.sv = g(c, '送った文の種類') || undefined; if (ix('送った本文') >= 0) { const sb = gt(c, '送った本文'); o.sb = sb && sb !== r['本文'] ? sb : undefined; } }
    }
    if (!sjis && ix('編集日') >= 0) { const ced = g(c, '編集日').trim();
      if (ced && ced > (cs.ed || '')) { const ce = gt(c, '編集後の本文'); const ne = ce && ce !== r['本文'] ? ce : undefined; if ((ne ?? null) !== (cs.e ?? null)) { o.e = ne; o.ed = ced; } } }
    if (Object.keys(o).length) add.push({id: id, over: over, o: o});
  });
  if (!add.length) { alert('新しく読み込む記録はありませんでした。' + (miss.length ? '\n店が見つからない行: ' + miss.length + '件（別のリストのCSVかもしれません）' : '')); return; }
  const over = add.filter(x => x.over).length;
  if (!confirm(add.length + '件の記録を読み込みます。' + (over ? '（うち ' + over + '件は、この端末の古い記録をCSVの新しい記録で置き換えます）' : '') + (miss.length ? '\n店が見つからない ' + miss.length + '件は読み込みません。' : '') + '\nよろしいですか？')) return;
  saveKeys(add.map(x => [x.id, x.o])); editing = null; render(); toast(add.length + '件の記録を読み込み');
}
