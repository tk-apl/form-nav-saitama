<html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#fff;--fg:#222;--mut:#666;--line:#ddd;--acc:#1f4e79;--ok:#2e7d32;--ng:#8a1c1c;--box:#f5f6f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Yu Gothic UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}

button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.ng{background:var(--ng);color:#fff;border-color:var(--ng)}
main{display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto 1fr;min-height:calc(100vh - 50px)}
#flt{grid-column:1;grid-row:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
#flt input{flex:1 1 100%;min-width:0;font:inherit;font-size:16px;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
#flt select{flex:1 1 0;min-width:0;font:inherit;font-size:16px;padding:5px 4px;border:1px solid var(--line);border-radius:6px;background:#fff}
#fcnt{font-size:12px;color:var(--mut);white-space:nowrap}
aside{grid-column:1;grid-row:2;border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 150px)}
aside .it{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:baseline}
aside .it.cur{background:#eef3f8}aside .it .n{color:var(--mut);width:26px;text-align:right}aside .it .s{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap}
aside .it.done .s{color:var(--ok)}aside .it.skip .s{color:var(--ng)}aside .none{padding:12px;color:var(--mut)}

.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0 12px;color:var(--mut)}.meta b{color:var(--fg);font-weight:600}

.rec{color:var(--mut)}

#mbar{display:none}

// ---- 記録（掲載元URL がキー。店ごとに読み直して足して書く）----
function norm(v){ if (v && typeof v === 'object') { if (v.r === '送信した') v.r = '送信完了'; if (v.r === '後で') v.r = 'スキップ'; } return v; }
function load(){ let s = {}; try { s = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e) {} for (const k in s) norm(s[k]); return s; }
function saveAll(s){ try { localStorage.setItem(KEY, JSON.stringify(s)); return true; } catch(e) { toast('保存できませんでした', 4000); return false; } }
function saveKeys(list){   // list = [[キー, {足す項目（undefined は消す）}], …]
  const s = load();
  list.forEach(([k, o]) => { const v = Object.assign({}, s[k] || {}, o); for (const f in v) if (v[f] === undefined || v[f] === null) delete v[f]; if (Object.keys(v).length) s[k] = v; else delete s[k]; });
  const ok = saveAll(s); state = s; return ok;
}
const saveKey = (k, o) => saveKeys([[k, o]]);
let state = load();
const st = r => state[ID(r)] || {};
// 旧ナビ（優先番号がキー）の記録を引き継ぐ。旧キーは消さない。新しい記録は上書きしない
(function migrate(){
  if (!LEGACY.length) return;
  const s = load(); const done = Array.isArray(s['#mig']) ? s['#mig'] : []; let n = 0, touched = false;
  LEGACY.forEach(L => {
    const ok = 'ff-nav:' + L.title + ':' + L.n; if (done.includes(ok)) return;
    let raw = null; try { raw = localStorage.getItem(ok); } catch(e) {}
    if (raw === null) return;
    let old = {}; try { old = JSON.parse(raw) || {}; } catch(e) {}
    for (const p in old) { const u = L.map[p]; const v = norm(Object.assign({}, old[p] || {})); if (!u) continue;
      const cur = s[u] || {}; let add = false; for (const f in v) if (cur[f] === undefined && v[f] !== undefined && v[f] !== '') { cur[f] = v[f]; add = true; }
      if (add) { s[u] = cur; n++; } }
    done.push(ok); touched = true;
  });
  if (touched) { s['#mig'] = done; saveAll(s); state = s; if (n) setTimeout(() => toast('前の記録を ' + n + '件引き継ぎ', 2500), 300); }
})();

const SENT_NEW = '明日から1週間ほどの間で、ご都合のよい日時を下記のフォームからお知らせいただければ、こちらからお電話いたします（下記のお電話・メールでも承ります）。';
const SENT_NEW2 = '明日から1週間ほどの間で、ご都合のよい日時を下記のメールアドレスにお知らせいただければ、こちらからお電話いたします（お電話でも承ります）。';
const SENT_OLD = 'ご都合のよい日時を下記のフォームからお知らせいただければ、こちらからお電話いたします（下記のお電話・メールでも承ります）。';
const SENT_OLD2 = 'ご都合のよい日時を下記のメールアドレスにお知らせいただければ、こちらからお電話いたします（お電話でも承ります）。';
function noUrl(t){
  const out = [];
  for (const line of String(t || '').replace(/\r\n?/g, '\n').split('\n')) {
    if (/^\s*(https?:\/\/|www\.)\S*\s*$/i.test(line)) { if (out.length && /^\s*▼/.test(out[out.length - 1])) out.pop(); continue; }
    out.push(line);
  }
  let s = out.join('\n');
  const found = s.includes(SENT_NEW) || s.includes(SENT_OLD) || s.includes(SENT_OLD2);
  s = s.split(SENT_NEW).join(SENT_NEW2).split(SENT_OLD).join(SENT_OLD2);
  s = s.replace(/\n[ \t　]*(?:\n[ \t　]*)+\n/g, '\n\n').replace(/^(?:[ \t　]*\n)+/, '').replace(/(?:\n[ \t　]*)+$/, '');
  return {text: s, warn: !found || /https?:|www\./i.test(s)};
}
function curText(r){ const s = st(r); return s.e != null ? s.e : r['本文']; }
function markDiff(t, o){
  if (t === o) return esc(t);
  const set = new Set(o.split('\n').map(x => x.trim()));
  return t.split('\n').map(x => x.trim() && !set.has(x.trim()) ? '<mark>' + esc(x) + '</mark>' : esc(x)).join('\n');
}

try { Object.assign(F, JSON.parse(localStorage.getItem(UIKEY) || '{}') || {}); } catch(e) {}
function saveUI(){ try { localStorage.setItem(UIKEY, JSON.stringify(F)); } catch(e) {} }
const nf = s => String(s ?? '').normalize('NFKC').toLowerCase().replace(/\s+/g, '');
const NAMES = ROWS.map(r => [nf(r['店名']), nf(r['掲載名'])]);
const TELS = ROWS.map(r => String(r['電話'] || '').normalize('NFKC').replace(/\D/g, ''));
function match(i){
  const r = ROWS[i], s = st(r);
  if (F.h !== 'すべて' && !String(r['送付手段'] || '').startsWith(F.h)) return false;
  if (F.s === 'まだ' && s.r) return false;
  if ((F.s === '送信完了' || F.s === 'スキップ') && s.r !== F.s) return false;
  if (F.s === '編集済み' && s.e == null) return false;
  const q = nf(F.q);
  if (q) {
    const byName = NAMES[i].some(x => x.includes(q));
    const dg = q.replace(/\D/g, '');
    const byTel = /^[\d\-‐−ー()+]+$/.test(q) && dg && TELS[i].includes(dg);
    if (!byName && !byTel) return false;
  }
  return true;
}
const vis = () => ROWS.map((_, i) => i).filter(match);

function parseCSV(t){

  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
